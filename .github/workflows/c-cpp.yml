name: Build CYD_MP3Player_Basic

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "TFT_eSPI" "XPT2046_Touchscreen"
          mkdir -p ~/Arduino/libraries
          git clone https://github.com/schreibfaul1/ESP32-audioI2S.git ~/Arduino/libraries/ESP32-audioI2S

      - name: Copy Shared Files to Sketch Folder
        run: |
          # Copy any root-level header and source files into the sketch directory
          cp *.h ./CYD_MP3Player_Basic/ 2>/dev/null || true
          cp *.cpp ./CYD_MP3Player_Basic/ 2>/dev/null || true

      - name: Compile CYD_MP3Player_Basic
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build ./CYD_MP3Player_Basic

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYD_MP3Player_Basic-bin
          path: build/*.bin
